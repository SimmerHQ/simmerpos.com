# Curated 5 star reviews from the Shopify App Store.
# Source: https://apps.shopify.com/simmer/reviews?ratings%5B%5D=5
# Shopify does not provide a public reviews API, so quotes are copied here when
# they are published. Keep quotes to complete sentences and keep the author,
# location and month accurate.
#
# `url` points at the individual review on the App Store. Shopify anchors each
# review as #review-<id>, but anchors only work on the page the review is
# currently shown on, so the url includes &page= as well. If a review drops off
# page 1 as newer reviews arrive, update its &page= and re-copy the id (inspect
# the review element in the browser: id="review-<id>").

